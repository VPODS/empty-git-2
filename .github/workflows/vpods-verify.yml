name: VPods verify

on:
  push:
    branches:
      - "vpods/verify/**"
  pull_request:
  workflow_dispatch:
    inputs:
      task_id:
        description: Hire task id
        required: false
        default: ""
      capture_preview:
        description: Capture desktop 1280 and mobile 390 screenshots after a successful build
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and build
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then npm ci; else npm install; fi
            # Nested client apps (e.g. TrackRouts.Client) — root install alone
            # leaves oxlint/vite missing and fails verify (TV0-46).
            if [ -d TrackRouts.Client ]; then
              if [ -f TrackRouts.Client/package-lock.json ]; then
                npm ci --prefix TrackRouts.Client
              else
                npm install --prefix TrackRouts.Client
              fi
            elif [ -d client ] && [ -f client/package.json ]; then
              if [ -f client/package-lock.json ]; then npm ci --prefix client; else npm install --prefix client; fi
            fi
            npm run lint --if-present
            npm run build --if-present
          fi
